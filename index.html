<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Halloween Pre-Trick-or-Treat Party — Sign Up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
<style>
:root{--g:#39ff88;--m:#ff2bd6;--p:#8a2be2;--bone:#e8e6f5;--dim:#8a86a8;--line:#2a1a55}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(ellipse at 88% 0,#3b0f6b 0,transparent 55%),radial-gradient(ellipse at 0 35%,#0a3a4a 0,transparent 50%),#06031a;background-attachment:fixed;color:var(--bone);font-family:'Cormorant Garamond',Georgia,serif;font-size:19px;min-height:100vh;padding:0 16px 120px}
.wrap{max-width:880px;margin:0 auto;position:relative;z-index:1}
header{text-align:center;padding:26px 0 10px}
.hero{width:min(440px,90%);height:auto;display:block;margin:0 auto -6px;filter:drop-shadow(0 0 26px rgba(57,255,136,.45))}
h1{font-family:'Creepster','Cinzel',Georgia,serif;font-weight:400;letter-spacing:.05em;font-size:clamp(2.3rem,8.5vw,4.2rem);line-height:1.05;margin:0;color:var(--g);text-shadow:0 0 8px var(--g),0 0 26px #14b85a,3px 3px 0 var(--p);animation:flick 6s infinite}
.sub{font-family:'Cinzel',Georgia,serif;letter-spacing:.3em;text-transform:uppercase;font-size:.85rem;color:var(--bone);margin-top:14px;text-shadow:0 0 10px var(--m)}
.div{color:var(--m);letter-spacing:.6em;margin:14px 0 4px;text-shadow:0 0 12px var(--m)}
.details{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:22px 0 10px}
.details label{display:block;font-family:'Cinzel',serif;font-size:.72rem;letter-spacing:.25em;text-transform:uppercase;color:var(--m);margin-bottom:2px}
.hint{text-align:center;font-style:italic;color:var(--dim);margin:14px 0 22px}
input{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--bone);font:inherit;padding:8px 6px;border-radius:0;outline:0;transition:.25s}
input::placeholder{color:#4a4470;font-style:italic}
input:focus{border-bottom-color:var(--g);box-shadow:0 8px 14px -10px var(--g);background:rgba(57,255,136,.06)}
.count{font-family:'Cinzel',serif;color:var(--g);text-align:right;font-size:.9rem;letter-spacing:.15em;margin-bottom:6px;text-shadow:0 0 10px rgba(57,255,136,.6)}
.head,.row{display:grid;grid-template-columns:1.3fr 1fr 1fr 34px;gap:14px;align-items:center}
.head{font-family:'Cinzel',serif;font-size:.75rem;letter-spacing:.3em;text-transform:uppercase;color:var(--m);padding:0 8px 8px;border-bottom:1px solid var(--p)}
.row{padding:2px 8px;border-bottom:1px solid #170f38;transition:.3s}
.row:hover{background:rgba(138,43,226,.12)}
.row .i{font-weight:700;font-size:1.05rem}
.row.taken .n{color:var(--g);font-weight:700;text-shadow:0 0 8px rgba(57,255,136,.5)}
.row.taken .i{color:var(--dim)}
.x{background:none;border:0;color:#4a3a7a;font-size:1.1rem;cursor:pointer;padding:4px;transition:.2s}
.x:hover{color:var(--m)}
footer{text-align:center;color:var(--dim);font-style:italic;margin-top:40px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:26px 16px 14px;background:linear-gradient(transparent,#06031a 45%);display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap}
.btn{font-family:'Cinzel',serif;font-weight:700;letter-spacing:.15em;text-transform:uppercase;font-size:.85rem;color:#fff;background:linear-gradient(90deg,#b0129a,#6a1bd1);border:1px solid var(--g);padding:12px 22px;cursor:pointer;box-shadow:0 0 16px rgba(57,255,136,.35);transition:.25s}
.btn:hover{filter:brightness(1.25)}
.btn:disabled{opacity:.5;cursor:wait}
.btn.ghost{background:transparent;color:var(--dim);border-color:var(--line);box-shadow:none}
.btn.ghost:hover{color:var(--bone);border-color:var(--g)}
.btn.dirty{animation:pulse 1.6s infinite}
#status{color:var(--dim);font-style:italic;font-size:.95rem;min-width:200px;text-align:center}
#mute{position:fixed;top:12px;right:14px;z-index:6;background:rgba(6,3,26,.7);border:1px solid var(--p);color:var(--bone);font-size:1.2rem;width:42px;height:42px;border-radius:50%;cursor:pointer}
#gate{position:fixed;inset:0;z-index:20;background:radial-gradient(ellipse at 50% 30%,#3b0f6b 0,#06031a 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;transition:opacity 1.2s}
#gate.gone{opacity:0;pointer-events:none}
#gate h2{font-family:'Creepster',serif;font-weight:400;letter-spacing:.05em;color:var(--g);font-size:clamp(2rem,7vw,3.2rem);text-shadow:0 0 10px var(--g),0 0 30px #14b85a,3px 3px 0 var(--p);margin:0 0 8px}
#gate p{color:var(--dim);font-style:italic;margin:0 0 28px}
#silent{background:none;border:0;color:var(--dim);margin-top:18px;cursor:pointer;font:inherit;font-style:italic;text-decoration:underline}
.bat{position:fixed;left:0;font-size:1.6rem;z-index:0;pointer-events:none;filter:drop-shadow(0 0 7px var(--m));opacity:.8;animation:fly linear infinite}
.b1{top:12%;animation-duration:26s}.b2{top:38%;animation-duration:34s;animation-delay:-12s;font-size:1.1rem}.b3{top:64%;animation-duration:30s;animation-delay:-20s;font-size:1.3rem}
#zap{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at 50% 0,rgba(138,43,226,.35),transparent 65%);animation:bolt 11s infinite}
#zap svg{width:100%;height:100%}
#zap path{fill:none;stroke:#d9b3ff;stroke-width:2.5;vector-effect:non-scaling-stroke;filter:drop-shadow(0 0 6px #b14dff) drop-shadow(0 0 16px var(--g))}
@keyframes fly{0%{transform:translate(-10vw,0)}50%{transform:translate(55vw,-7vh)}100%{transform:translate(110vw,5vh)}}
@keyframes flick{0%,100%{opacity:1}45%{opacity:.93}47%{opacity:.75}49%{opacity:1}80%{opacity:.96}}
@keyframes pulse{50%{box-shadow:0 0 28px rgba(255,43,214,.85)}}
@keyframes bolt{0%,86%,100%{opacity:0}87%{opacity:.95}88%{opacity:.15}89.5%{opacity:1}92%{opacity:0}}
@media(max-width:640px){
 .details{grid-template-columns:1fr}
 .head{display:none}
 .row{grid-template-columns:1fr 34px;grid-template-areas:"i x" "n n" "o o";gap:0 8px;padding:12px 8px}
 .row .i{grid-area:i}.row .n{grid-area:n}.row .o{grid-area:o}.row .x{grid-area:x}
}
@media(prefers-reduced-motion:reduce){.bat,#zap{display:none}h1,.btn.dirty{animation:none}}
</style>
</head>
<body>
<!--
  MUSIC: put your Thriller MP3 in the same folder as this page and name it thriller.mp3
  (or change MUSIC_FILE below). If the file is missing, a synthesized spooky ambience plays instead.
  SHARING: by default, edits save in each visitor's own browser only. To share one list with
  everyone, deploy apps-script-backend.gs and paste its Web App URL into SHARED_URL below.
-->
<div id="gate">
  <h2>Enter, If You Dare</h2>
  <p>Sound on for the full experience</p>
  <button class="btn" id="enter">Enter the Mansion</button>
  <button id="silent">enter without sound</button>
</div>
<button id="mute" title="Toggle music" aria-label="Toggle music">🔇</button>
<div id="zap"><svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path d="M22 0L14 26L22 28L10 62L18 44L12 42L6 70"/><path d="M80 0L88 30L80 33L92 66L84 48L90 46L96 80"/></svg></div>
<span class="bat b1">🦇</span><span class="bat b2">🦇</span><span class="bat b3">🦇</span>

<div class="wrap">
  <header>
    <svg class="hero" viewBox="0 0 400 170" aria-hidden="true">
      <defs><radialGradient id="mg"><stop offset="0" stop-color="#f2fff5"/><stop offset=".6" stop-color="#7dffa8"/><stop offset="1" stop-color="#1fd25f"/></radialGradient></defs>
      <circle cx="200" cy="74" r="52" fill="url(#mg)"/>
      <polygon fill="#06031a" points="0,170 0,150 40,150 40,128 52,112 64,128 64,150 110,150 110,120 122,120 122,100 134,84 146,100 146,120 158,120 158,150 176,150 176,96 188,96 188,70 200,48 212,70 212,96 224,96 224,150 242,150 242,120 254,120 254,100 266,84 278,100 278,120 290,120 290,150 336,150 336,128 348,112 360,128 360,150 400,150 400,170"/>
      <g fill="#ff2bd6"><rect x="194" y="104" width="12" height="18"/><rect x="128" y="108" width="10" height="14"/><rect x="262" y="108" width="10" height="14"/><rect x="46" y="132" width="10" height="12"/><rect x="342" y="132" width="10" height="12"/></g>
    </svg>
    <h1>Halloween Pre-Trick-or-Treat Party</h1>
    <div class="sub">The gathering begins at 4:00 PM</div>
    <div class="div">✦ 🩸 ✦</div>
  </header>

  <div class="details">
    <div><label for="date">Date</label><input id="date" maxlength="80" placeholder="Add the date…"></div>
    <div><label for="loc">Location</label><input id="loc" maxlength="120" placeholder="Add the address…"></div>
  </div>

  <p class="hint">Claim an offering: type your name beside what you'll bring. Every field can be edited — press <b>Save</b> to seal it.</p>

  <div class="count" id="count"></div>
  <div class="head"><span>Offering</span><span>Name</span><span>Notes</span><span></span></div>
  <div id="list"></div>

  <footer>🦇 Thank you for feeding the night 🦇</footer>
</div>

<div class="bar">
  <button class="btn ghost" id="add">+ Add a row</button>
  <button class="btn" id="save">Save changes</button>
  <span id="status"></span>
</div>

<script>
const CFG = { SHARED_URL: "", MUSIC_FILE: "thriller.mp3" };   // SHARED_URL: your Apps Script Web App URL
const KEY = "halloween-signup-v1";
const $ = id => document.getElementById(id);
const uid = () => Math.random().toString(36).slice(2, 9);

const ITEMS = ["Chili","Chili","Mac & cheese","Hot dogs & buns","Pizza","Pulled pork / sliders",
 "Chips","Chips","Queso / salsa","Veggie tray","Fruit tray","Cornbread / rolls",
 "Cupcakes","Cookies","Rice Krispie treats","Halloween treat of your choice",
 "Apple cider","Lemonade / punch","Water bottles","Plates & napkins","Cups & utensils","Trash bags","Ice",
 "Open – add your own item!","Open – add your own item!","Open – add your own item!"];

let S = { date:"", location:"", metaT:0, deleted:[], rows: ITEMS.map((s,i)=>({id:"d"+i,item:s,name:"",note:"",t:0})) };
let dirty = false;

const store = v => { try { localStorage.setItem(KEY, JSON.stringify(v)); } catch(e){} };
const status = t => $("status").textContent = t;
const setDirty = () => { dirty = true; $("save").classList.add("dirty"); status("Unsaved changes"); };

function count() {
  const n = S.rows.filter(r => r.name.trim()).length;
  $("count").textContent = n + " of " + S.rows.length + " claimed";
}

function field(cls, ph, max, row, key) {
  const el = document.createElement("input");
  el.className = cls; el.placeholder = ph; el.maxLength = max; el.value = row[key];
  el.setAttribute("aria-label", ph);
  el.oninput = () => {
    row[key] = el.value; row.t = Date.now();
    if (key === "name") el.parentElement.classList.toggle("taken", !!el.value.trim());
    count(); setDirty();
  };
  return el;
}

function render() {
  $("date").value = S.date || ""; $("loc").value = S.location || "";
  const list = $("list"); list.textContent = "";
  S.rows.forEach(r => {
    const d = document.createElement("div");
    d.className = "row" + (r.name.trim() ? " taken" : "");
    d.append(field("i","Item",60,r,"item"), field("n","Your name",40,r,"name"), field("o","Notes",80,r,"note"));
    const x = document.createElement("button");
    x.className = "x"; x.textContent = "✕"; x.title = "Remove row"; x.setAttribute("aria-label","Remove row");
    x.onclick = () => { S.rows = S.rows.filter(q => q !== r); S.deleted.push(r.id); render(); setDirty(); };
    d.append(x); list.append(d);
  });
  count();
}

$("date").oninput = e => { S.date = e.target.value; S.metaT = Date.now(); setDirty(); };
$("loc").oninput = e => { S.location = e.target.value; S.metaT = Date.now(); setDirty(); };

$("add").onclick = () => {
  S.rows.push({ id: uid(), item:"", name:"", note:"", t: Date.now() });
  render(); setDirty();
  const ins = document.querySelectorAll(".row .i"); ins[ins.length-1].focus();
  window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
};

async function save() {
  const b = $("save"); b.disabled = true; status("Saving…");
  store(S);
  if (CFG.SHARED_URL) {
    try {
      const res = await fetch(CFG.SHARED_URL, { method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify(S) });
      const d = await res.json();
      if (!d || !d.rows) throw new Error("bad response");
      S = Object.assign({ deleted:[] }, d); store(S);
      dirty = false; b.classList.remove("dirty"); render();
      status("Saved ✓ Everyone can see it now");
    } catch (e) { status("Couldn't reach the server — try Save again"); }
  } else {
    dirty = false; b.classList.remove("dirty");
    status("Saved on this device only (preview mode)");
  }
  b.disabled = false;
}
$("save").onclick = save;
window.addEventListener("beforeunload", e => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });

async function pull() {
  const res = await fetch(CFG.SHARED_URL);
  const d = await res.json();
  if (d && d.rows && d.rows.length) { S = Object.assign({ deleted:[] }, d); store(S); render(); }
}

(async function init() {
  try { const j = JSON.parse(localStorage.getItem(KEY)); if (j && j.rows) S = j; } catch(e){}
  render();
  if (CFG.SHARED_URL) {
    status("Summoning the list…");
    try { await pull(); status(""); } catch(e) { status("Offline — showing your last saved copy"); }
    setInterval(() => {
      if (dirty || document.hidden || document.activeElement.tagName === "INPUT") return;
      pull().catch(()=>{});
    }, 45000);
  } else status("Preview mode: saves only in this browser");
})();

/* ---------- Music: your MP3 if present, otherwise synthesized ambience ---------- */
let track, ac, master, muted = true, started = false;
const LEVEL = 0.6;

function startAmbient() {
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  ac = new AC();
  master = ac.createGain(); master.gain.value = 0; master.connect(ac.destination);
  master.gain.linearRampToValueAtTime(muted ? 0 : LEVEL, ac.currentTime + 5);
  const echo = ac.createDelay(2); echo.delayTime.value = .55;
  const fb = ac.createGain(); fb.gain.value = .55; echo.connect(fb); fb.connect(echo);
  const wet = ac.createGain(); wet.gain.value = .5; echo.connect(wet); wet.connect(master);
  const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 380; lp.Q.value = 4; lp.connect(master);
  const lfo = ac.createOscillator(), lg = ac.createGain();
  lfo.frequency.value = .08; lg.gain.value = 200; lfo.connect(lg); lg.connect(lp.frequency); lfo.start();
  [[55,"sawtooth",.16],[55.5,"sawtooth",.16],[110,"sine",.12],[130.8,"sine",.05],[155.6,"triangle",.04]].forEach(([f,t,g]) => {
    const o = ac.createOscillator(), v = ac.createGain();
    o.type = t; o.frequency.value = f; v.gain.value = g; o.connect(v); v.connect(lp); o.start();
  });
  const N = [220,233.08,261.63,311.13,329.63,415.3,466.16];
  (function bell() {
    const f = N[Math.floor(Math.random()*N.length)] * (Math.random() < .3 ? 2 : 1), t = ac.currentTime;
    [[1,.5],[2.76,.18],[5.4,.06]].forEach(([m,a]) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.frequency.value = f*m;
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(a*.35,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+5);
      o.connect(g); g.connect(echo); g.connect(master); o.start(t); o.stop(t+5.2);
    });
    setTimeout(bell, 3000 + Math.random()*5000);
  })();
}

function startMusic() {
  if (started) { if (track) track.play().catch(()=>{}); if (ac) ac.resume(); return; }
  started = true;
  if (CFG.MUSIC_FILE) {
    track = new Audio(CFG.MUSIC_FILE); track.loop = true; track.volume = LEVEL; track.muted = muted;
    track.addEventListener("error", () => { track = null; startAmbient(); }, { once: true });
    track.play().catch(()=>{});
  } else startAmbient();
}

function setMuted(m) {
  muted = m; $("mute").textContent = m ? "🔇" : "🔊";
  if (track) track.muted = m;
  if (ac) { master.gain.cancelScheduledValues(ac.currentTime); master.gain.setTargetAtTime(m ? 0 : LEVEL, ac.currentTime, .3); }
}

const closeGate = () => $("gate").classList.add("gone");
$("enter").onclick = () => { setMuted(false); startMusic(); closeGate(); };
$("silent").onclick = closeGate;
$("mute").onclick = () => { if (!started) { setMuted(false); startMusic(); } else setMuted(!muted); };
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { if (track) track.pause(); if (ac) ac.suspend(); }
  else if (started) { if (track) track.play().catch(()=>{}); if (ac) ac.resume(); }
});
</script>
</body>
</html>
